<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Wildcraft Tycoon 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f141b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #floating-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    .float-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.75);
      white-space: nowrap;
      will-change: transform, opacity;
    }
    #banner-toast {
      position: fixed;
      top: 108px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(22, 29, 38, 0.92);
      border: 1.5px solid rgba(245, 158, 11, 0.7);
      color: #fde68a;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }
    #banner-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #biome-pill {
      position: fixed;
      top: 98px;
      left: 14px;
      background: rgba(15, 20, 27, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      pointer-events: none;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #joystick-zone {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 58vw;
      height: 52vh;
      z-index: 15;
    }
    #joystick-base {
      position: fixed;
      left: 28px;
      bottom: 36px;
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.16) 100%);
      border: 2px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 0 18px rgba(255, 255, 255, 0.08);
      pointer-events: none;
      transition: opacity 0.18s ease;
      opacity: 0.72;
    }
    #joystick-base.active {
      opacity: 1;
      border-color: rgba(245, 158, 11, 0.85);
    }
    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 48px;
      height: 48px;
      margin-left: -24px;
      margin-top: -24px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fbbf24, #d97706);
      border: 2.5px solid #fef3c7;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.5);
      will-change: transform;
    }
    #joystick-hint {
      position: fixed;
      left: 28px;
      bottom: 16px;
      width: 116px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(248, 250, 252, 0.65);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 14;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f141b 100%);
      color: #f8fafc;
      z-index: 50;
      transition: opacity 0.35s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(245, 158, 11, 0.25);
      border-top-color: #f59e0b;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="floating-layer"></div>
  <div id="biome-pill">Green Forest</div>
  <div id="banner-toast"></div>

  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>
  <div id="joystick-hint">Move</div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="font-size: 15px; font-weight: 700; letter-spacing: 0.3px;">
      Building 3D Frontier...
    </div>
  </div>

  <script>
    (function loadThreeAndBoot() {
      const cdnUrls = [
        "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
        "https://unpkg.com/three@0.128.0/build/three.min.js",
        "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
      ];
      let idx = 0;
      function tryLoadNext() {
        if (window.THREE) {
          bootGameScript();
          return;
        }
        if (idx >= cdnUrls.length) {
          document.getElementById("loading-text").textContent =
            "3D engine requires network access to load Three.js.";
          return;
        }
        const s = document.createElement("script");
        s.src = cdnUrls[idx++];
        s.onload = function () {
          if (window.THREE) bootGameScript();
          else tryLoadNext();
        };
        s.onerror = tryLoadNext;
        document.head.appendChild(s);
      }
      function bootGameScript() {
        const g = document.createElement("script");
        g.src = "game.js";
        document.body.appendChild(g);
      }
      tryLoadNext();
    })();
  </script>
</body>
</html>
